networks:
  studyinghub:
    name: studyinghub
    driver: bridge

volumes:
  postgres-db-user:  # renamed for clarity (each DB gets its own volume if needed)
  # keycloak-data:

services:
  user:
    container_name: user
    build:
      context: ../user
      dockerfile: Dockerfile
    image: user
    depends_on:
    - discovery
    - postgres-db-user
    ports:
    - "8081:8081"
    networks: [studyinghub]

  #discovery services
  discovery:
    container_name: discovery
    build:
      context: ../discovery
      dockerfile: Dockerfile
    image: discovery
    ports:
      - "8761:8761"
    networks: [studyinghub]
  #so thu :)
  zookeeper:
    container_name: zookeeper
    image: debezium/zookeeper:2.7.3.Final
    ports:
      - "2181:2181"
    networks: [studyinghub]
  #kafka
  kafka:
    container_name: kafka
    image: apache/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on: [zookeeper]
    networks: [studyinghub]

  # connect
  connect:
    container_name: connect
    image: debezium/connect:2.7.3.Final
    ports:
      - "8083:8083"
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=connect_configs
      - OFFSET_STORAGE_TOPIC=connect_offsets
      - STATUS_STORAGE_TOPIC=connect_status
      - KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - VALUE_CONVERTER_SCHEMAS_ENABLE=false
      - KEY_CONVERTER_SCHEMAS_ENABLE=false
      - ENABLE_DEBEZIUM_SCRIPTING=true
    depends_on: [kafka]
    networks: [studyinghub]

  # user service's database
  postgres-db-user:
    image: postgres:15
    container_name: postgres-db-user
    environment:
      POSTGRES_DB: STUDYINGHUB_DB_USER
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d STUDYINGHUB_DB_USER" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [studyinghub]
    volumes:
      - postgres-db-user:/var/lib/postgresql/data
  
