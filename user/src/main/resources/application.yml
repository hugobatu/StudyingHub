server:
  port: 8081
  servlet:
    context-path: /user

spring:
  application:
    name: user
  datasource:
    url: jdbc:postgresql://postgres-db:5432/STUDYINGHUB_DB
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://discovery:8761/eureka/
  instance:
    prefer-ip-address: true

keycloak:
  auth-server-url: http://keycloak:8080
  realm: studyinghub
  resource: user-service
  public-client: true
  bearer-only: true
